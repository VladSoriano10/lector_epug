plugins { id 'com.android.application' }
def signingValues = ['VLADER_KEYSTORE_PATH', 'VLADER_STORE_PASSWORD', 'VLADER_KEY_ALIAS', 'VLADER_KEY_PASSWORD'].collectEntries { [(it): System.getenv(it)] }
def hasReleaseKey = signingValues.values().every { it != null && !it.isEmpty() }
android {
    namespace 'sv.vlad.lector'
    compileSdk 35
    defaultConfig {
        applicationId 'sv.vlad.lector'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '0.3.3'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(signingValues.VLADER_KEYSTORE_PATH)
                storePassword signingValues.VLADER_STORE_PASSWORD
                keyAlias signingValues.VLADER_KEY_ALIAS
                keyPassword signingValues.VLADER_KEY_PASSWORD
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
}
gradle.taskGraph.whenReady { graph ->
    if (!hasReleaseKey && graph.allTasks.any { it.name in ['packageRelease', 'signReleaseBundle'] }) {
        throw new GradleException('Falta la firma permanente de VladER. Consulta docs/FIRMA.md; no se genera una clave nueva ni se usa debug como reemplazo.')
    }
}
dependencies {
    implementation 'org.jsoup:jsoup:1.18.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
