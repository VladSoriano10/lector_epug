name: Compilar APK
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader-panels:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Permitir aceleración del emulador de pruebas
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb shell wm size 1080x1920
            adb shell wm density 420
            gradle connectedDebugAndroidTest --no-daemon
            adb pull /sdcard/Download/VladERTests/panel-aa.png panel-aa.png
            adb pull /sdcard/Download/VladERTests/panel-voces.png panel-voces.png
            adb pull /sdcard/Download/VladERTests/panel-indice.png panel-indice.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paneles-android
          path: |
            panel-*.png
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
  pagination:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Verificar páginas y posiciones
        run: PAGING_SCREENSHOT=pagination.png node tests/pagination.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vista-lectura
          path: pagination.png
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Pruebas, revisión y APK
        run: gradle testDebugUnitTest lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lector-epub-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Probar firma release con clave desechable (no distribuir)
        shell: bash
        run: |
          set -euo pipefail
          if gradle assembleRelease --no-daemon > "$RUNNER_TEMP/signing-guard.log" 2>&1; then
            echo 'ERROR: release no debe compilar sin firma configurada'
            exit 1
          fi
          grep -q 'Falta la firma permanente' "$RUNNER_TEMP/signing-guard.log"
          export VLADER_KEYSTORE_PATH="$RUNNER_TEMP/vlader-signing-test.p12"
          export VLADER_STORE_PASSWORD='temporary-ci-test-only'
          export VLADER_KEY_PASSWORD="$VLADER_STORE_PASSWORD"
          export VLADER_KEY_ALIAS='ci-test-only'
          trap 'rm -f -- "$VLADER_KEYSTORE_PATH" app/build/outputs/apk/release/app-release.apk' EXIT
          keytool -genkeypair -keystore "$VLADER_KEYSTORE_PATH" -storetype PKCS12 -alias "$VLADER_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=Disposable CI Test' -storepass:env VLADER_STORE_PASSWORD -keypass:env VLADER_KEY_PASSWORD
          gradle testReleaseUnitTest lintRelease assembleRelease --no-daemon
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informes
          path: app/build/reports/
